name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # Archive snapshot: fetch from a testnet seed and stream into the
      # `examples_node-archive` docker volume on prod BEFORE the deploy step
      # brings the stack up.
      #
      # Why: PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG.md — the dapp sidecar runs
      # in partial-ledger mode by default (the `--wallet-owner` flags trigger
      # the wallet-seed shortcut, which hydrates a partial UTXO overlay
      # instead of the full tree). That breaks `RecentTxEntry.source`
      # resolution for ~half the inbound traffic. Booting from a full
      # archive snapshot fixes it: the node loads the full tree at startup,
      # and from then on every block is applied in full mode and source
      # resolution is authoritative.
      #
      # Required GitHub Actions secrets (one-time setup):
      #   SEED_SSH_KEY    — private key authorized on testnet-seed1
      #                     (matches the public key in seed1's authorized_keys)
      #   GH_PAT_USERNODE — PAT with `repo` scope on Usernode-Labs/usernode
      #                     (only needed if the repo stays private; remove
      #                     the `token:` line below if it's public)
      #
      # Existing secrets reused: SSH_KEY, SSH_HOST, SSH_PORT, SSH_USER.
      #
      # The fetch+stream pipeline is ~1–2 min for a several-hundred-MB
      # snapshot. Skipping it (e.g. seed temporarily unreachable) is safe
      # because the node has `--archive` and persists snapshots itself —
      # the existing volume just gets reused.
      # ----------------------------------------------------------------------
      - name: Checkout usernode (for fetch-archive-snapshot.sh)
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode-src
          token: ${{ secrets.GH_PAT_USERNODE }}

      - name: Configure SSH (testnet seeds + prod)
        env:
          SEED_SSH_KEY: ${{ secrets.SEED_SSH_KEY }}
          PROD_SSH_KEY: ${{ secrets.SSH_KEY }}
          PROD_HOST:    ${{ secrets.SSH_HOST }}
          PROD_PORT:    ${{ secrets.SSH_PORT }}
          PROD_USER:    ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SEED_SSH_KEY" > ~/.ssh/seed_key && chmod 600 ~/.ssh/seed_key
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key && chmod 600 ~/.ssh/prod_key
          cat > ~/.ssh/config <<EOF
          Host testnet-seed1
            HostName 65.109.68.86
            User usernode
            IdentityFile ~/.ssh/seed_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          Host testnet-seed2
            HostName 65.109.99.245
            User usernode
            IdentityFile ~/.ssh/seed_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          Host prod
            HostName ${PROD_HOST}
            Port ${PROD_PORT}
            User ${PROD_USER}
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Fetch archive snapshot from testnet-seed1
        id: fetch_archive
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p ./archive-staging
          ./usernode-src/scripts/fetch-archive-snapshot.sh testnet-seed1 ./archive-staging --replace
          echo "==> Staged archive size:"
          du -sh archive-staging

      - name: Stream archive into prod docker volume
        if: steps.fetch_archive.outcome == 'success'
        run: |
          set -euxo pipefail
          # Stream the staged snapshot over SSH directly into a one-shot
          # alpine container that writes into the `examples_node-archive`
          # named volume on prod. No intermediate tarball ever lives on
          # the prod box.
          #
          # `examples_node-archive` is the default compose-derived volume
          # name (project = `examples` from the compose file's parent dir,
          # service-volume = `node-archive`). If you ever set
          # COMPOSE_PROJECT_NAME or `name:` in the compose file, update
          # the volume name here to match.
          tar -czf - -C archive-staging . | ssh prod \
            'docker run --rm -i -v examples_node-archive:/archive alpine sh -c "rm -rf /archive/* && tar -xzf - -C /archive && echo \"==> Volume populated: $(du -sh /archive | cut -f1)\""'

      - name: Note if archive fetch was skipped
        if: steps.fetch_archive.outcome != 'success'
        run: |
          echo "::warning::Archive fetch from testnet-seed1 failed; deploy will reuse whatever is already in the node-archive volume on prod. The node has --archive (read+write) so this is safe as long as the volume is not empty. If this is a fresh deploy, the node will start with no archive and produce a partial-ledger sidecar (the bug returns until the next successful fetch)."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euxo pipefail
            REPO_DIR=${{ secrets.DEPLOY_PATH }}
            cd "$REPO_DIR"
            echo "==> Working directory: $(pwd)"
            echo "==> Git status:"
            git status --short

            echo "==> Writing .env from secrets..."
            # SANDS_APP_PUBKEY / OM_APP_PUBKEY / USERNAMES_PUBKEY are public
            # addresses (no secret-key counterparts) but routed through GH
            # secrets to keep the .env writer single-sourced.
            #
            # USERNODE_IMAGE is optional: leave the secret unset (or empty)
            # and compose falls back to `usernodelabs/usernode:latest`. Set
            # it to e.g. `ghcr.io/your-org/usernode:my-branch` to run a
            # locally-built image on prod (must be linux/amd64; see the
            # `usernode-image-amd64` Make target).
            cat > .env <<'ENVEOF'
            APP_PUBKEY=${{ secrets.APP_PUBKEY }}
            APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            VOTE_ENCRYPT_SEED=${{ secrets.VOTE_ENCRYPT_SEED }}
            OM_ADMIN_PUBKEY=${{ secrets.OM_ADMIN_PUBKEY }}
            OM_APP_PUBKEY=${{ secrets.OM_APP_PUBKEY }}
            ECHO_APP_PUBKEY=${{ secrets.ECHO_APP_PUBKEY }}
            ECHO_APP_SECRET_KEY=${{ secrets.ECHO_APP_SECRET_KEY }}
            SANDS_APP_PUBKEY=${{ secrets.SANDS_APP_PUBKEY }}
            USERNAMES_PUBKEY=${{ secrets.USERNAMES_PUBKEY }}
            USERNODE_IMAGE=${{ secrets.USERNODE_IMAGE }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env
            echo "==> .env written ($(wc -l < .env) lines)"

            echo "==> Pulling latest code..."
            git pull --recurse-submodules
            git submodule update --init --recursive

            echo "==> Stopping old containers..."
            docker compose down || true
            cd "$REPO_DIR/examples/falling-sands"
            docker compose down 2>/dev/null || true
            docker stop falling-sands 2>/dev/null || true
            docker rm falling-sands 2>/dev/null || true

            echo "==> Deploying combined examples server..."
            cd "$REPO_DIR/examples"
            # --env-file ../.env feeds compose-time ${VAR} substitution (e.g.
            # --wallet-owner ${APP_PUBKEY}). Without it, compose only reads
            # examples/.env (doesn't exist) and substitutes empty strings,
            # which crashes the node sidecar with a bech32 parse error.
            COMPOSE="docker compose --env-file ../.env"
            $COMPOSE down || true
            echo "==> Pulling latest node sidecar image..."
            # Tolerant of failure: if USERNODE_IMAGE points at a tag that
            # only exists locally (e.g. `usernode:local-amd64` from a
            # one-off `docker save`/`docker load`), `pull` will 404 — but
            # `up -d` will still find the image in the local daemon. We
            # only want to abort if the image is genuinely unavailable,
            # which `up -d` reports clearly.
            $COMPOSE pull node || echo "==> pull skipped (image may be local-only); continuing"
            $COMPOSE up -d --build 2>&1
            $COMPOSE ps
            echo "==> Combined examples server started."

            echo "==> All running containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "==> Deploy complete!"
