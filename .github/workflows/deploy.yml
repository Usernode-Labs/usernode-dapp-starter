name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wipe_node_data:
        description: "Drop examples_node-data before up. Forces a fresh p2p identity and clean work-dir; archive snapshot is preserved. Use when the sidecar is stuck in Connecting / 0 peers."
        required: false
        default: false
        type: boolean
      recreate_node:
        description: "Pass --force-recreate to docker compose up so the node container is cycled even when compose doesn't detect a change. Cheap and safe; useful when latest tag was repulled but the running container kept the old SHA."
        required: false
        default: false
        type: boolean
      dump_logs:
        description: "After up, sleep 30s and dump dapp-node logs + /status probes into the action output. Auto-enables when wipe_node_data or recreate_node is set; explicit toggle for log-only inspection without state changes. Off by default on push deploys to keep them quiet."
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Single SSH session into prod that does:
      #   1. git pull dapp-starter (brings new code + vendored scripts)
      #   2. write .env from secrets
      #   3. fetch a fresh archive snapshot from testnet-seed1 directly
      #      (uses prod's existing SSH access to the seed; no GH-runner-side
      #      seed key required)
      #   4. stream the snapshot into the examples_node-archive docker volume
      #      (or fail-fast if the fetch failed AND the existing volume is
      #      empty, to avoid silently degrading to partial-ledger mode and
      #      re-triggering PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG)
      #   5. docker compose up the dapp + sidecar node
      #
      # Required GitHub Actions secrets:
      #   SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY  - prod
      #   DEPLOY_PATH                            - prod path to repo
      #   APP_*, ECHO_*, OM_*, SANDS_APP_*,      - dapp config
      #   SANDS_ADMIN_PUBKEY,                    - falling-sands admin gate
      #   USERNAMES_*, VOTE_ENCRYPT_SEED,
      #   USERNODE_IMAGE
      #
      # Required prod-side prerequisites:
      #   - prod can `ssh testnet-seed1` (the script's default target).
      #     Verify with `ssh prod 'ssh -o BatchMode=yes -o ConnectTimeout=5
      #     testnet-seed1 echo ok'` — should print `ok`. If not, configure
      #     ~/.ssh/config on prod to map `testnet-seed1` to the seed host
      #     with an identity file that's authorized there. Match what
      #     usernode/scripts/fetch-archive-snapshot.sh expects.
      #   - prod has docker + bash + tar + ssh + scp (it already does;
      #     the existing deploy uses all of these).
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # workflow_dispatch booleans render as "true" / "false"; on push events
          # `inputs.*` is null and these expressions render as "false". The remote
          # `[ "$X" = "true" ]` tests treat anything non-"true" as off, so push
          # deploys behave identically to the pre-input version.
          #
          # DUMP_LOGS is OR'd at template time so any remediation flag implies
          # log capture (you almost certainly want logs when you're actively
          # poking the sidecar) without forcing operators to set both inputs.
          WIPE_NODE_DATA: ${{ inputs.wipe_node_data }}
          RECREATE_NODE: ${{ inputs.recreate_node }}
          DUMP_LOGS: ${{ inputs.dump_logs == true || inputs.wipe_node_data == true || inputs.recreate_node == true }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          envs: WIPE_NODE_DATA,RECREATE_NODE,DUMP_LOGS
          script: |
            set -euxo pipefail
            REPO_DIR=${{ secrets.DEPLOY_PATH }}
            cd "$REPO_DIR"
            echo "==> Working directory: $(pwd)"
            echo "==> Git status:"
            git status --short

            echo "==> Pulling latest code..."
            git pull --recurse-submodules
            git submodule update --init --recursive

            echo "==> Writing .env from secrets..."
            # SANDS_APP_PUBKEY / OM_APP_PUBKEY / USERNAMES_PUBKEY are public
            # addresses (no secret-key counterparts) but routed through GH
            # secrets to keep the .env writer single-sourced.
            #
            # USERNODE_IMAGE is optional: leave the secret unset (or empty)
            # and compose falls back to `usernodelabs/usernode:latest`.
            cat > .env <<'ENVEOF'
            APP_PUBKEY=${{ secrets.APP_PUBKEY }}
            APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            VOTE_ENCRYPT_SEED=${{ secrets.VOTE_ENCRYPT_SEED }}
            OM_ADMIN_PUBKEY=${{ secrets.OM_ADMIN_PUBKEY }}
            OM_APP_PUBKEY=${{ secrets.OM_APP_PUBKEY }}
            ECHO_APP_PUBKEY=${{ secrets.ECHO_APP_PUBKEY }}
            ECHO_APP_SECRET_KEY=${{ secrets.ECHO_APP_SECRET_KEY }}
            SANDS_APP_PUBKEY=${{ secrets.SANDS_APP_PUBKEY }}
            SANDS_ADMIN_PUBKEY=${{ secrets.SANDS_ADMIN_PUBKEY }}
            USERNAMES_PUBKEY=${{ secrets.USERNAMES_PUBKEY }}
            USERNODE_IMAGE=${{ secrets.USERNODE_IMAGE }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env
            echo "==> .env written ($(wc -l < .env) lines)"

            # ----------------------------------------------------------
            # Archive snapshot: fetch from testnet-seed1 directly from
            # prod (reuses prod's existing seed SSH access — no GH-runner-
            # side key needed). Why: PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG.md
            # — the sidecar's `--wallet-owner` flags trigger the wallet-
            # seed shortcut (partial-ledger overlay) by default. Booting
            # from a full archive snapshot fixes it: node loads the full
            # tree at startup and applies every subsequent block in full
            # mode, so RecentTxEntry.source is authoritative.
            # ----------------------------------------------------------
            STAGING_DIR="/tmp/usernode-archive-staging-$$"
            ARCHIVE_VOLUME="examples_node-archive"
            FETCH_OK=0

            echo "==> Fetching fresh archive snapshot from testnet-seed1..."
            mkdir -p "$STAGING_DIR"
            if ./scripts/fetch-archive-snapshot.sh testnet-seed1 "$STAGING_DIR" --replace; then
              FETCH_OK=1
              echo "==> Staged archive size:"
              du -sh "$STAGING_DIR"
            else
              echo "==> WARNING: archive fetch from testnet-seed1 failed."
            fi

            if [ "$FETCH_OK" = "1" ]; then
              echo "==> Streaming staged snapshot into docker volume $ARCHIVE_VOLUME..."
              # One-shot alpine container that wipes the existing volume
              # contents and unpacks the fresh snapshot in place.
              tar -czf - -C "$STAGING_DIR" . | docker run --rm -i \
                -v "$ARCHIVE_VOLUME:/archive" alpine \
                sh -c 'rm -rf /archive/* /archive/.[!.]* /archive/..?* 2>/dev/null; tar -xzf - -C /archive && echo "==> Volume populated: $(du -sh /archive | cut -f1)"'
              rm -rf "$STAGING_DIR"
            else
              # Fetch failed. The sidecar's --archive flag will self-write
              # new snapshots over time, so a non-empty existing volume is
              # fine to reuse. But an EMPTY volume means the sidecar boots
              # without an archive → wallet-seed shortcut → partial-ledger
              # mode → silent dapp breakage. Fail loudly instead.
              echo "==> Probing existing archive volume..."
              ARCHIVE_SIZE=$(docker run --rm -v "$ARCHIVE_VOLUME:/archive" alpine du -sb /archive 2>/dev/null | cut -f1 || echo 0)
              echo "==> Existing archive size: ${ARCHIVE_SIZE:-0} bytes"
              # A live archive (chain_id + checkpoint binprots + blocks dir)
              # is tens to hundreds of MB. Anything under 1 MB is effectively
              # empty (likely just a stale chain_id stub).
              if [ "${ARCHIVE_SIZE:-0}" -lt 1000000 ]; then
                echo "::error::Archive fetch from testnet-seed1 FAILED and prod has no usable existing archive (${ARCHIVE_SIZE:-0} bytes). Refusing to deploy a partial-ledger sidecar — that would silently break every dapp via PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG. Fix prod's SSH access to testnet-seed1 (or pre-seed the volume manually) and re-run."
                rm -rf "$STAGING_DIR"
                exit 1
              fi
              echo "::warning::Archive fetch failed but prod has an existing archive (${ARCHIVE_SIZE} bytes from a previous deploy or self-write). Continuing with that snapshot — sidecar will boot in full mode."
            fi

            echo "==> Stopping old containers..."
            docker compose down || true
            cd "$REPO_DIR/examples/falling-sands"
            docker compose down 2>/dev/null || true
            docker stop falling-sands 2>/dev/null || true
            docker rm falling-sands 2>/dev/null || true

            echo "==> Deploying combined examples server..."
            cd "$REPO_DIR/examples"
            # --env-file ../.env feeds compose-time ${VAR} substitution
            # (e.g. --wallet-owner ${APP_PUBKEY}). Without it, compose only
            # reads examples/.env (doesn't exist) and substitutes empty
            # strings, which crashes the node sidecar with a bech32 parse
            # error.
            COMPOSE="docker compose --env-file ../.env"
            $COMPOSE down || true

            # Optional: wipe `examples_node-data` (the node's work-dir +
            # p2p identity + peer cache) when the workflow_dispatch input
            # `wipe_node_data` is set. Use this when the sidecar is wedged
            # in `Connecting` / `peers: 0` after a deploy — typical cause
            # is stale on-disk peer state that survives across deploys
            # (we already wipe `examples_node-archive` every run, but
            # `examples_node-data` is preserved by design). Safe: the node
            # regenerates a p2p identity on boot and re-bootstraps from
            # the freshly-fetched archive snapshot; seeds accept the new
            # identity normally.
            if [ "${WIPE_NODE_DATA:-false}" = "true" ]; then
              echo "==> wipe_node_data=true — dropping examples_node-data volume"
              docker volume rm examples_node-data 2>/dev/null || \
                echo "==> volume already absent, continuing"
            fi

            echo "==> Pulling latest node sidecar image..."
            # Tolerant of failure: if USERNODE_IMAGE points at a tag that
            # only exists locally (e.g. `usernode:local-amd64` from a
            # one-off `docker save`/`docker load`), `pull` will 404 — but
            # `up -d` will still find the image in the local daemon.
            $COMPOSE pull node || echo "==> pull skipped (image may be local-only); continuing"

            # Optional: --force-recreate the node container even if the
            # image SHA hasn't changed (compose will skip recreate
            # otherwise). Useful when `:latest` was repulled but the
            # running container retained the previous SHA, or when the
            # container is wedged in some bad in-memory state and just
            # needs a clean cycle.
            UP_ARGS="-d --build"
            if [ "${RECREATE_NODE:-false}" = "true" ]; then
              echo "==> recreate_node=true — passing --force-recreate"
              UP_ARGS="$UP_ARGS --force-recreate"
            fi
            $COMPOSE up $UP_ARGS 2>&1
            $COMPOSE ps
            echo "==> Combined examples server started."

            # ----------------------------------------------------------
            # Optional diagnostic tail: dump the sidecar's startup logs
            # plus internal/public /status into the GH Actions output so
            # we can see *why* peering fails when it does. Without this
            # we're flying blind from a remote status endpoint that only
            # reports `Connecting` / `peers: 0` with no error string.
            # Gated behind DUMP_LOGS to keep push deploys quiet (auto-on
            # whenever wipe_node_data or recreate_node is set, since
            # those imply active debugging).
            # ----------------------------------------------------------
            if [ "${DUMP_LOGS:-false}" = "true" ]; then
              echo "==> Waiting 30s for node startup..."
              sleep 30
              echo "==> dapp-node logs (last 300 lines):"
              docker logs --tail 300 dapp-node 2>&1 || \
                echo "::warning::could not read dapp-node logs"
              echo "==> dapp-node peer/dial/connect/seed/listen log lines:"
              docker logs dapp-node 2>&1 | \
                grep -iE "peer|dial|connect|seed|listen|p2p|webrtc|quic|error|warn" | \
                tail -100 || true

              echo "==> /status from host (dapp-node runs in network_mode: host):"
              curl -sfm 5 http://localhost:3000/status \
                | python3 -c "
import sys, json
s = json.load(sys.stdin)
peers = s.get('peers', [])
connected = sum(1 for p in peers if p.get('connection_status') == 'Connected')
print(f'  sync_status={s.get(\"node_sync_status\")}  peers={len(peers)} connected={connected}')
print(f'  best_tip_height={s.get(\"blockchain\", {}).get(\"best_tip\", {}).get(\"height\")}')
" || echo "::warning::host loopback could not reach dapp-node"
              echo
              echo "==> public /__usernode/node_status:"
              curl -sfm 5 https://dapps.usernodelabs.org/__usernode/node_status | \
                head -c 800 || \
                echo "::warning::public node_status endpoint unreachable"
              echo
            fi

            echo "==> All running containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "==> Deploy complete!"
