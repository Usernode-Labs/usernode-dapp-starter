services:
  node:
    # Defaults to the published image; override with USERNODE_IMAGE=<tag> to
    # run a locally-built usernode (e.g. testing a feature branch end-to-end).
    # See the `usernode-image` / `examples-up-local` Make targets.
    image: ${USERNODE_IMAGE:-usernodelabs/usernode:latest}
    container_name: dapp-node
    env_file:
      - path: ../.env
        required: false
    environment:
      USERNODE_GENESIS_URL: ${GENESIS_URL:-https://static.usernodelabs.org/testnet/genesis.json}
      PEER_LIST_URL: ${SEEDLIST_URL:-https://static.usernodelabs.org/testnet/seedlist.txt}
      RUST_LOG: info
    # Every address tracked here gets a per-recipient ring buffer for the SSE
    # recent_tx_stream; without it dapp servers that rely on streaming (Sands,
    # Opinion Market, Usernames, Echo, Last One Wins, etc.) silently fall back
    # to slow explorer polling.
    #
    # `--archive --archive-path /archive` makes the sidecar a true full-ledger
    # node (fixes PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG.md — RecentTxEntry.source
    # was null for ~half of incoming txs because the partial UTXO tree couldn't
    # resolve commitments belonging to non-tracked owners). The deploy workflow
    # populates the `node-archive` volume with a fresh snapshot from a seed
    # node before bringing the stack up; from then on the node both LOADS that
    # snapshot at boot AND WRITES new ones at the snapshot interval, so
    # subsequent restarts (and even deploys that skip the fetch) recover from
    # whatever's on disk.
    command:
      - "--work-dir"
      - "/var/lib/usernode"
      - "--archive"
      - "--archive-path"
      - "/archive"
      - "--port"
      - "3000"
      - "--enable-recent-tx-stream"
      - "--wallet-owner"
      - "${APP_PUBKEY}"
      - "--wallet-owner"
      - "${ECHO_APP_PUBKEY}"
      - "--wallet-owner"
      - "${SANDS_APP_PUBKEY}"
      - "--wallet-owner"
      - "${OM_APP_PUBKEY}"
      - "--wallet-owner"
      - "${USERNAMES_PUBKEY}"
    volumes:
      - node-data:/var/lib/usernode
      - node-archive:/archive
    # Bind the node's HTTP port to the host loopback so an operator
    # SSHed into prod can `curl http://localhost:3000/...` directly
    # against the sidecar — `/status`, `/wallet/by_owner`,
    # `/transactions/stream`, etc. — without bouncing through
    # dapp-examples' proxy. Bound to 127.0.0.1 (NOT 0.0.0.0) so the
    # node's RPC stays off the public internet; nginx-proxy still
    # exposes only `dapp-examples:8000` via VIRTUAL_HOST. Removing
    # the bind reverts to in-network-only (works fine for the dapps,
    # blind for ops).
    ports:
      - "127.0.0.1:3000:3000"
    # NOTE: deliberately NOT on `proxy-network`. Earlier topology had the
    # node sidecar attached only to nginx-proxy's external `proxy-network`,
    # which routes TCP fine but breaks the WebRTC data-channel UDP path
    # used by the P2P stack — outbound HTTP signaling reaches the testnet
    # seeds, but ICE/DTLS/SCTP-over-UDP never completes, so every dial
    # times out at 15s with `peers: 0` despite repeated retries. (Confirmed
    # by 1:1 comparison with social-vibecoding, which runs the same image
    # + flags but on a vanilla project-owned bridge and peers within 30s.)
    # `dapp-internal` is a fresh docker bridge with default NAT
    # behavior, which carries UDP correctly. dapp-examples joins both
    # networks so it can still reach the node via `node:3000` AND remain
    # discoverable by nginx-proxy on `proxy-network`.
    networks:
      - dapp-internal
    restart: unless-stopped

  dapp-examples:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: dapp-examples
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8000"
      NODE_RPC_URL: "http://node:3000"
      SNAPSHOT_DIR: "/app/data"
      VIRTUAL_HOST: "dapps.usernodelabs.org"
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: "dapps.usernodelabs.org"
    expose:
      - "8000"
    volumes:
      - sands-data:/app/data
    networks:
      # `dapp-internal` for talking to the node sidecar by service name.
      # `proxy-network` for nginx-proxy public routing of VIRTUAL_HOST.
      - dapp-internal
      - proxy-network
    restart: unless-stopped

volumes:
  sands-data:
  node-data:
  node-archive:

networks:
  # Project-owned bridge that carries node↔dapp-examples traffic AND is
  # the node sidecar's egress for outbound P2P UDP. Default `bridge`
  # driver settings — that's the whole point: vanilla docker NAT makes
  # WebRTC's DTLS/SCTP-over-UDP work, whereas `proxy-network` (nginx-
  # proxy's external network) does not.
  dapp-internal:
    driver: bridge
  proxy-network:
    external: true
