services:
  node:
    # Defaults to the published image; override with USERNODE_IMAGE=<tag> to
    # run a locally-built usernode (e.g. testing a feature branch end-to-end).
    # See the `usernode-image` / `examples-up-local` Make targets.
    image: ${USERNODE_IMAGE:-usernodelabs/usernode:latest}
    container_name: dapp-node
    env_file:
      - path: ../.env
        required: false
    environment:
      USERNODE_GENESIS_URL: ${GENESIS_URL:-https://static.usernodelabs.org/testnet/genesis.json}
      PEER_LIST_URL: ${SEEDLIST_URL:-https://static.usernodelabs.org/testnet/seedlist.txt}
      RUST_LOG: info
    # Every address tracked here gets a per-recipient ring buffer for the SSE
    # recent_tx_stream; without it dapp servers that rely on streaming (Sands,
    # Opinion Market, Usernames, Echo, Last One Wins, etc.) silently fall back
    # to slow explorer polling.
    #
    # `--archive --archive-path /archive` makes the sidecar a true full-ledger
    # node (fixes PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG.md — RecentTxEntry.source
    # was null for ~half of incoming txs because the partial UTXO tree couldn't
    # resolve commitments belonging to non-tracked owners). The deploy workflow
    # populates the `node-archive` volume with a fresh snapshot from a seed
    # node before bringing the stack up; from then on the node both LOADS that
    # snapshot at boot AND WRITES new ones at the snapshot interval, so
    # subsequent restarts (and even deploys that skip the fetch) recover from
    # whatever's on disk.
    command:
      - "--work-dir"
      - "/var/lib/usernode"
      - "--archive"
      - "--archive-path"
      - "/archive"
      - "--port"
      - "3000"
      - "--enable-recent-tx-stream"
      - "--wallet-owner"
      - "${APP_PUBKEY}"
      - "--wallet-owner"
      - "${ECHO_APP_PUBKEY}"
      - "--wallet-owner"
      - "${SANDS_APP_PUBKEY}"
      - "--wallet-owner"
      - "${OM_APP_PUBKEY}"
      - "--wallet-owner"
      - "${USERNAMES_PUBKEY}"
    volumes:
      - node-data:/var/lib/usernode
      - node-archive:/archive
    # `network_mode: host` is REQUIRED for P2P to function on this host.
    #
    # The usernode P2P stack uses WebRTC datachannels (HTTP signaling +
    # ICE/DTLS/SCTP over UDP). Empirically, on testnet-mini-apps every
    # docker bridge variant we tried (proxy-network, project-owned
    # `dapp-internal`, default `docker0`) fails at the WebRTC ICE
    # connectivity-check phase: HTTP signaling completes, the SDP offer
    # contains valid srflx candidates discovered via STUN, but the
    # `FinalizePending → FinalizeSuccess` transition never happens and
    # every dial times out at 15s with `reason=local close`. Direct
    # comparison: a one-off `docker run --network=host` of the same
    # image on the same host reaches Synced with 25+ peers within 30s.
    #
    # The host's NAT is well-behaved otherwise: cone NAT confirmed via
    # raw STUN binding from the same socket to 4 different STUN servers
    # (all returned the same external port), MTU is uniform 1500 across
    # bridges + enp35s0, outbound UDP egress works (DNS + STUN both
    # succeeded). Whatever's broken in the bridge→ICE path on this host
    # didn't surface on social-vibecoding's host with the same image.
    # Diagnosing the underlying NAT/iptables/conntrack issue would be a
    # separate spelunking exercise; host networking is the proven fix.
    #
    # Side effects:
    #   - Node binds 0.0.0.0:3000 directly on the host. Wallet endpoints
    #     are auth-gated (signer registration requires the secret key,
    #     which only this server has via .env), so public exposure is
    #     safe; read endpoints (/status, /transactions/*) are public by
    #     design anyway.
    #   - dapp-examples can no longer reach the node via `node:3000` on
    #     a docker network. It uses `host.docker.internal:3000` instead
    #     (configured in the dapp-examples service below).
    #   - The previous host-loopback `ports: ["127.0.0.1:3000:3000"]`
    #     is no longer needed: `network_mode: host` makes the node bind
    #     directly on the host's network namespace, so localhost queries
    #     work natively.
    network_mode: host
    restart: unless-stopped

  dapp-examples:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: dapp-examples
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8000"
      # Node sidecar runs in `network_mode: host`, so it's reachable on
      # the host's gateway IP from any docker bridge. `host-gateway` is
      # docker's portable alias for that, mapped via `extra_hosts` below.
      NODE_RPC_URL: "http://host.docker.internal:3000"
      SNAPSHOT_DIR: "/app/data"
      VIRTUAL_HOST: "dapps.usernodelabs.org"
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: "dapps.usernodelabs.org"
    extra_hosts:
      # Required for `NODE_RPC_URL=http://host.docker.internal:3000` to
      # resolve from inside this container. Docker auto-injects this on
      # Mac/Windows but not on Linux, so we set it explicitly. Keeps
      # working on dev machines too (no-op when the alias is already
      # present from docker desktop).
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - sands-data:/app/data
    networks:
      - proxy-network
    restart: unless-stopped

volumes:
  sands-data:
  node-data:
  node-archive:

networks:
  proxy-network:
    external: true
